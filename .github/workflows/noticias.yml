name: Noticias Diarias Chile

on:
  # HORARIO: lunes a jueves 19:00 CLT, viernes 15:00 CLT.
  # Los cron de GitHub llegan con 2–5,5 h de ATRASO (medido sep–oct 2026), pero nunca antes
  # de tiempo. Por eso los cron "de espera" son de MAÑANA: la corrida arranca temprano y
  # DUERME hasta 18:59 / 14:59 CLT (jobs espera-1 y espera-2, hasta ~11,5 h en total).
  # Repo público → minutos de Actions gratis.
  workflow_dispatch:
    inputs:
      origen:
        description: "programado = respeta franja horaria y anti-doble-envío; manual = envía siempre"
        required: false
        default: manual
      prueba:
        description: "Prueba: genera el briefing y muestra los resúmenes en el log, sin enviar correo ni publicar"
        type: boolean
        required: false
        default: false
      fecha_edicion:
        description: "Prueba con un día pasado (AAAA-MM-DD): envía el correo marcado [PRUEBA], sin publicar"
        required: false
        default: ""
      hora_envio:
        description: "Prueba de la espera (HH:MM hora Chile): duerme hasta esa hora antes de enviar"
        required: false
        default: ""
  schedule:
    # Espera: arrancan de mañana y duermen hasta la hora exacta (cuatro por si GitHub omite
    # alguno; las que llegan mientras otra duerme quedan en cola y el gate las omite).
    # Chile UTC-3 (sep–abr) / UTC-4 (abr–sep); espera máxima 10 h 22 min (< 11,5 h).
    - cron: '37 12 * * 1-4'   # L-J ≈09:37 CLT (UTC-3) / 08:37 (UTC-4)
    - cron: '7 14 * * 1-4'    # L-J ≈11:07 CLT (UTC-3) / 10:07 (UTC-4)
    - cron: '37 15 * * 1-4'   # L-J ≈12:37 CLT (UTC-3) / 11:37 (UTC-4)
    - cron: '7 17 * * 1-4'    # L-J ≈14:07 CLT (UTC-3) / 13:07 (UTC-4)
    - cron: '37 8 * * 5'      # V  ≈05:37 CLT (UTC-3) / 04:37 (UTC-4)
    - cron: '7 10 * * 5'      # V  ≈07:07 CLT (UTC-3) / 06:07 (UTC-4)
    - cron: '37 11 * * 5'     # V  ≈08:37 CLT (UTC-3) / 07:37 (UTC-4)
    - cron: '7 13 * * 5'      # V  ≈10:07 CLT (UTC-3) / 09:07 (UTC-4)
    # Respaldo tardío: si nada salió, envía aunque sea tarde (L-J hasta 23:59, V hasta 20:59).
    - cron: '35 0 * * 2-5'    # L-J ≈21:35 CLT
    - cron: '35 20 * * 5'     # V  ≈17:35 CLT

permissions:
  contents: write   # para publicar el HTML en la rama `pages`

concurrency:
  # Las corridas programadas se serializan entre sí (una duerme, las demás esperan y luego
  # el gate las omite); las manuales/pruebas van aparte para no quedar bloqueadas horas.
  group: noticias-diarias-${{ github.event_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: America/Santiago
  PUBLIC_BASE_URL: https://matiasargoter.github.io/Noticias-diarias

jobs:
  # Dos tramos de espera encadenados: cada job de GitHub tiene un límite de 6 h.
  espera-1:
    if: ${{ github.event_name == 'schedule' || inputs.hora_envio != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Esperar la hora de envío (tramo 1)
        run: .github/scripts/esperar.sh "${{ inputs.hora_envio }}"

  espera-2:
    needs: espera-1
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.hora_envio != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Esperar la hora de envío (tramo 2)
        run: .github/scripts/esperar.sh "${{ inputs.hora_envio }}"

  enviar-noticias:
    needs: [espera-1, espera-2]
    if: ${{ !cancelled() }}   # corre aunque las esperas se omitan (manual) o fallen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: ¿El briefing de hoy ya se publicó?
        id: gate
        env:
          ORIGEN: ${{ github.event_name == 'schedule' && 'programado' || inputs.origen || 'manual' }}
        run: |
          HOY=$(date +%F)
          echo "hoy=$HOY" >> "$GITHUB_OUTPUT"
          ALREADY=false
          if git ls-remote --exit-code --heads origin pages >/dev/null 2>&1; then
            git fetch --depth=1 origin pages
            if git cat-file -e "FETCH_HEAD:noticias_${HOY}.html" 2>/dev/null; then
              ALREADY=true
            fi
          fi
          echo "already=$ALREADY" >> "$GITHUB_OUTPUT"
          # Corridas automáticas (cron de GitHub o cron-job.org) no reenvían si ya salió hoy.
          SKIP=false
          if [ "$ALREADY" = "true" ] && [ "$ORIGEN" != "manual" ]; then
            SKIP=true
            echo "::notice::El briefing de $HOY ya está publicado — se omite esta corrida automática."
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Instalar Python 3.11
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: pip install requests beautifulsoup4

      - name: Ejecutar script (scrape + análisis IA + email)
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OUTPUT_DIR: ${{ github.workspace }}/site
          DRY_RUN: ${{ inputs.prueba && '1' || '' }}
          FECHA_EDICION: ${{ inputs.fecha_edicion }}
          ORIGEN: ${{ github.event_name == 'schedule' && 'programado' || inputs.origen || 'manual' }}
        run: python "noticias_diarias.py"

      - name: Publicar en GitHub Pages (rama pages)
        if: ${{ steps.gate.outputs.skip != 'true' && !inputs.prueba && inputs.fecha_edicion == '' }}
        run: |
          set -e
          if ! ls site/*.html >/dev/null 2>&1; then
            echo "No hay HTML nuevo (script omitido o fuera de franja) — nada que publicar."
            exit 0
          fi
          git config user.name  "noticias-bot"
          git config user.email "noticias-bot@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin pages >/dev/null 2>&1; then
            git fetch origin pages:refs/remotes/origin/pages
            git worktree add site_pages refs/remotes/origin/pages
            git -C site_pages checkout -B pages
          else
            git worktree add --detach site_pages
            git -C site_pages checkout --orphan pages
            git -C site_pages rm -rf . >/dev/null 2>&1 || true
          fi

          cp -f site/*.html site_pages/
          touch site_pages/.nojekyll

          # conservar solo los últimos 40 briefings fechados
          ls -1 site_pages/noticias_*.html 2>/dev/null | sort | head -n -40 | xargs -r rm -f

          git -C site_pages add -f -A
          git -C site_pages commit -m "briefing $(date +%F)" || { echo "sin cambios"; exit 0; }
          git -C site_pages push origin HEAD:pages
