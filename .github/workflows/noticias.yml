name: Noticias Diarias Chile

on:
  schedule:
    # Invierno (abr–sep): 22:30 UTC = 18:30 CLT (UTC-4)
    - cron: '30 22 * * 1-5'
    # Verano  (oct–mar): 21:30 UTC = 18:30 CLT (UTC-3)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # permite correrlo manualmente desde GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: America/Santiago

jobs:
  enviar-noticias:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 anthropic

      - name: Ejecutar script (scrape + análisis IA + email)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OUTPUT_DIR: /tmp
        run: python "noticias_diarias.py"
