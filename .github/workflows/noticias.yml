name: Noticias Diarias Chile

on:
  # HORARIO: lunes a jueves 19:00 CLT, viernes 15:00 CLT.
  # Los cron de GitHub llegan con 1–4 h de ATRASO pero nunca antes de tiempo. Por eso
  # hay crons "de espera" varias horas antes: el job arranca temprano y DUERME hasta la
  # hora exacta (paso "Esperar la hora exacta"). Repo público → minutos gratis.
  # Opcional: un disparo externo (cron-job.org → workflow_dispatch origen=programado).
  workflow_dispatch:
    inputs:
      origen:
        description: "programado = disparo automático (respeta franja horaria y anti-doble-envío); manual = envía siempre"
        required: false
        default: manual
      prueba:
        description: "Prueba: genera el briefing y muestra los resúmenes en el log, sin enviar correo ni publicar"
        type: boolean
        required: false
        default: false
  # RESPALDO: cron de GitHub por si cron-job.org falla. Chile usa UTC-3 (sep–abr) y
  # UTC-4 (abr–sep): hay crons para ambos offsets. Si el briefing de hoy ya salió, se
  # omiten; si no, envían aunque lleguen tarde (L-J hasta 23:59, V hasta 20:59 CLT).
  schedule:
    # Espera (arrancan antes y duermen hasta 18:59 / 14:59 CLT; dos por si GitHub omite uno).
    # Chile UTC-3 (sep–abr) / UTC-4 (abr–sep): la espera máxima queda < 6 h (límite del job).
    - cron: '37 17 * * 1-4'   # L-J ≈14:37 CLT (UTC-3) / 13:37 (UTC-4)
    - cron: '37 19 * * 1-4'   # L-J ≈16:37 CLT (UTC-3) / 15:37 (UTC-4)
    - cron: '37 13 * * 5'     # V  ≈10:37 CLT (UTC-3) / 09:37 (UTC-4)
    - cron: '37 15 * * 5'     # V  ≈12:37 CLT (UTC-3) / 11:37 (UTC-4)
    # Respaldo tardío: si nada salió, envía aunque sea tarde (L-J hasta 23:59, V hasta 20:59).
    - cron: '35 0 * * 2-5'    # L-J ≈21:35 CLT
    - cron: '35 20 * * 5'     # V  ≈17:35 CLT

permissions:
  contents: write   # para publicar el HTML en la rama `pages`

concurrency:
  # Las corridas programadas se serializan entre sí (una duerme, las demás esperan y luego
  # el gate las omite); las manuales/pruebas van aparte para no quedar bloqueadas horas.
  group: noticias-diarias-${{ github.event_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: America/Santiago
  PUBLIC_BASE_URL: https://matiasargoter.github.io/Noticias-diarias

jobs:
  enviar-noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Esperar la hora exacta de envío (solo corridas programadas)
        if: ${{ github.event_name == 'schedule' || inputs.prueba }}
        env:
          SOLO_CALCULAR: ${{ github.event_name != 'schedule' }}   # en prueba: calcula, no duerme
        run: |
          case "$(date +%u)" in          # TZ=America/Santiago (env del workflow)
            1|2|3|4) OBJ="18:59:00" ;;
            5)       OBJ="14:59:00" ;;
            *)       echo "Fin de semana — sin envío."; exit 0 ;;
          esac
          ESPERA=$(( $(date -d "today $OBJ" +%s) - $(date +%s) ))
          if [ "$ESPERA" -gt 0 ]; then
            echo "Ahora $(date +%T) CLT — esperando $((ESPERA / 60)) min hasta las $OBJ CLT…"
            [ "$SOLO_CALCULAR" = "true" ] && { echo "(prueba: no se duerme)"; exit 0; }
            sleep "$ESPERA"
          else
            echo "Ya pasó la hora objetivo ($OBJ CLT): corrida de respaldo, se continúa."
          fi

      - name: ¿El briefing de hoy ya se publicó?
        id: gate
        env:
          ORIGEN: ${{ github.event_name == 'schedule' && 'programado' || inputs.origen || 'manual' }}
        run: |
          HOY=$(date +%F)
          echo "hoy=$HOY" >> "$GITHUB_OUTPUT"
          ALREADY=false
          if git ls-remote --exit-code --heads origin pages >/dev/null 2>&1; then
            git fetch --depth=1 origin pages
            if git cat-file -e "FETCH_HEAD:noticias_${HOY}.html" 2>/dev/null; then
              ALREADY=true
            fi
          fi
          echo "already=$ALREADY" >> "$GITHUB_OUTPUT"
          # Corridas automáticas (cron de GitHub o cron-job.org) no reenvían si ya salió hoy.
          SKIP=false
          if [ "$ALREADY" = "true" ] && [ "$ORIGEN" != "manual" ]; then
            SKIP=true
            echo "::notice::El briefing de $HOY ya está publicado — se omite esta corrida automática."
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Instalar Python 3.11
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: pip install requests beautifulsoup4

      - name: Ejecutar script (scrape + análisis IA + email)
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OUTPUT_DIR: ${{ github.workspace }}/site
          DRY_RUN: ${{ inputs.prueba && '1' || '' }}
          ORIGEN: ${{ github.event_name == 'schedule' && 'programado' || inputs.origen || 'manual' }}
        run: python "noticias_diarias.py"

      - name: Publicar en GitHub Pages (rama pages)
        if: ${{ steps.gate.outputs.skip != 'true' && !inputs.prueba }}
        run: |
          set -e
          if ! ls site/*.html >/dev/null 2>&1; then
            echo "No hay HTML nuevo (script omitido o fuera de franja) — nada que publicar."
            exit 0
          fi
          git config user.name  "noticias-bot"
          git config user.email "noticias-bot@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin pages >/dev/null 2>&1; then
            git fetch origin pages:refs/remotes/origin/pages
            git worktree add site_pages refs/remotes/origin/pages
            git -C site_pages checkout -B pages
          else
            git worktree add --detach site_pages
            git -C site_pages checkout --orphan pages
            git -C site_pages rm -rf . >/dev/null 2>&1 || true
          fi

          cp -f site/*.html site_pages/
          touch site_pages/.nojekyll

          # conservar solo los últimos 40 briefings fechados
          ls -1 site_pages/noticias_*.html 2>/dev/null | sort | head -n -40 | xargs -r rm -f

          git -C site_pages add -f -A
          git -C site_pages commit -m "briefing $(date +%F)" || { echo "sin cambios"; exit 0; }
          git -C site_pages push origin HEAD:pages
